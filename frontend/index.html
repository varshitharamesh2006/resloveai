<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORD Bot — Customer Support</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --accent: #6d8bff;
    --accent-2: #8f6dff;
    --text: #e7e9ee;
    --text-dim: #9aa0ac;
    --success: #35c37a;
    --warn: #e8b33d;
    --border: #262b36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: radial-gradient(circle at 20% -10%, #1b2036 0%, var(--bg) 55%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; color: var(--text-dim); }

  #customer-picker { display: flex; gap: 8px; align-items: center; }
  select, button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
  }
  button { cursor: pointer; }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    font-weight: 600;
  }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #chat-col {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 72%; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.escalated { border-color: var(--warn); }
  .escalation-badge {
    display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
    color: #1a1200; background: var(--warn); padding: 3px 8px; border-radius: 6px; letter-spacing: 0.3px;
  }

  #input-row {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  #input-row input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
  }
  #input-row input:focus { outline: none; border-color: var(--accent); }

  #trace-col {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    background: var(--panel);
  }
  #trace-col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-top: 0; }
  .trace-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .trace-item .tool-name { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .trace-item pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--text-dim); font-size: 11px; }
  .empty-hint { color: var(--text-dim); font-size: 13px; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
  .suggestions button { font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>ORD Bot</h1>
      <div class="sub">AI customer support resolution agent — demo</div>
    </div>
  </div>
  <div id="customer-picker">
    <select id="customer-select"></select>
    <button class="primary" id="start-btn">Start conversation</button>
  </div>
</header>

<main>
  <div id="chat-col">
    <div id="messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <div id="input-row">
      <input id="message-input" type="text" placeholder="Type a message... e.g. 'Where is my order ORD5002?'" disabled />
      <button class="primary" id="send-btn" disabled>Send</button>
    </div>
  </div>
  <div id="trace-col">
    <h2>Agent Trace (tools called)</h2>
    <div id="trace-list"><div class="empty-hint">Tool calls will appear here as the agent works.</div></div>
  </div>
</main>

<script>
const API_BASE = "http://localhost:8000";
let conversationId = null;

const customerSelect = document.getElementById("customer-select");
const startBtn = document.getElementById("start-btn");
const messagesEl = document.getElementById("messages");
const traceListEl = document.getElementById("trace-list");
const input = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const suggestionsEl = document.getElementById("suggestions");

const SUGGESTIONS = [
  "Where is my order ORD5002?",
  "I want to return the smartwatch from ORD5003, it's defective",
  "Refund me ₹9000 for ORD5005, I never even opened the box",
  "Cancel my order ORD5006",
  "I want to speak to a real person"
];

async function loadCustomers() {
  const res = await fetch(`${API_BASE}/api/customers`);
  const customers = await res.json();
  customerSelect.innerHTML = customers.map(c =>
    `<option value="${c.customer_id}">${c.name} (${c.customer_id}, ${c.loyalty_tier})</option>`
  ).join("");
}

function addMessage(text, role, escalated=false) {
  const div = document.createElement("div");
  div.className = `msg ${role}` + (escalated ? " escalated" : "");
  div.textContent = text;
  if (escalated) {
    const badge = document.createElement("div");
    badge.className = "escalation-badge";
    badge.textContent = "ESCALATED TO HUMAN AGENT";
    div.appendChild(document.createElement("br"));
    div.appendChild(badge);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTrace(trace) {
  if (!trace || trace.length === 0) return;
  if (traceListEl.querySelector(".empty-hint")) traceListEl.innerHTML = "";
  trace.forEach(t => {
    const item = document.createElement("div");
    item.className = "trace-item";
    item.innerHTML = `<div class="tool-name">${t.tool}</div>
      <pre>input: ${JSON.stringify(t.input)}</pre>
      <pre>result: ${JSON.stringify(t.result, null, 0)}</pre>`;
    traceListEl.appendChild(item);
  });
  traceListEl.scrollTop = traceListEl.scrollHeight;
}

function renderSuggestions() {
  suggestionsEl.innerHTML = "";
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { input.value = s; sendMessage(); };
    suggestionsEl.appendChild(b);
  });
}

async function startConversation() {
  const customerId = customerSelect.value;
  const res = await fetch(`${API_BASE}/api/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ customer_id: customerId }),
  });
  const data = await res.json();
  conversationId = data.conversation_id;
  messagesEl.innerHTML = "";
  traceListEl.innerHTML = '<div class="empty-hint">Tool calls will appear here as the agent works.</div>';
  addMessage(`Hi ${data.customer_name}, I'm ORD Bot. How can I help with your order today?`, "bot");
  input.disabled = false;
  sendBtn.disabled = false;
  renderSuggestions();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || !conversationId) return;
  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;

  const thinking = document.createElement("div");
  thinking.className = "msg bot";
  thinking.textContent = "…";
  messagesEl.appendChild(thinking);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });
    const data = await res.json();
    thinking.remove();
    addMessage(data.reply, "bot", data.escalated);
    addTrace(data.tool_trace);
  } catch (e) {
    thinking.remove();
    addMessage("Error contacting ORD Bot backend. Is the server running on localhost:8000?", "bot");
  }
  sendBtn.disabled = false;
}

startBtn.onclick = startConversation;
sendBtn.onclick = sendMessage;
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

loadCustomers();
</script>

</body>
</html>
